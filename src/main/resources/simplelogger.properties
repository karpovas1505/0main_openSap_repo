# SLF4J Simple Logger Configuration

# Default log level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=INFO

# Log level for our application
org.slf4j.simpleLogger.log.com.example.mcp=DEBUG

# Show date and time in logs
org.slf4j.simpleLogger.showDateTime=true

# Date time format
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss

# Show thread name
org.slf4j.simpleLogger.showThreadName=true

# Show log name
org.slf4j.simpleLogger.showLogName=true

# Show short log name
org.slf4j.simpleLogger.showShortLogName=false

# Log file (comment out to log to console)
# org.slf4j.simpleLogger.logFile=mcp-client.log

# Log levels for external libraries
org.slf4j.simpleLogger.log.org.java_websocket=WARN
org.slf4j.simpleLogger.log.org.apache.hc=WARN
org.slf4j.simpleLogger.log.com.fasterxml.jackson=WARN